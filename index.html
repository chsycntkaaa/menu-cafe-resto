<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inche Cafe - Menu Digital</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Menghubungkan ke berkas CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="phone-container">
        <!-- Header -->
        <header>
            <h1>Inche Cafe ✨</h1>
            <p>Pilih menu favoritmu dan pesan langsung!</p>
        </header>

        <!-- Search Bar -->
        <div class="search-box">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Cari kopi atau makanan...">
            </div>
        </div>

        <!-- Filter Kategori -->
        <div class="categories">
            <button class="cat-btn active" onclick="filterMenu('all', event)">Semua</button>
            <button class="cat-btn" onclick="filterMenu('coffee', event)">Kopi</button>
            <button class="cat-btn" onclick="filterMenu('non-coffee', event)">Non-Kopi</button>
            <button class="cat-btn" onclick="filterMenu('food', event)">Makanan</button>
        </div>

        <!-- Daftar Menu -->
        <div class="menu-list" id="menuList"></div>

        <div class="empty-state" id="emptyState">
            <i class="fa-solid fa-mug-hot" style="font-size: 32px; margin-bottom: 8px;"></i>
            <p>Menu tidak ditemukan</p>
        </div>
    </div>

    <!-- Floating Cart Bar -->
    <div class="cart-bar hidden" id="cartBar" onclick="openCartModal()">
        <div class="cart-info">
            <span class="cart-count" id="cartCount">0 Pesanan</span>
            <span class="cart-total" id="cartTotal">Rp 0</span>
        </div>
        <div class="cart-action">
            Lihat Pesanan <i class="fa-solid fa-arrow-right"></i>
        </div>
    </div>

    <!-- Modal Ringkasan Pesanan (Checkout) -->
    <div class="modal" id="cartModal" onclick="closeCartModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 class="modal-title">Ringkasan Pesanan 📝</h2>
            
            <!-- Daftar Item Pesanan dalam Keranjang -->
            <div id="cartItemsList"></div>

            <div class="modal-total-box">
                <span>Total Pembayaran</span>
                <span id="modalTotalPrice" style="color: var(--primary);">Rp 0</span>
            </div>

            <a id="waCheckoutBtn" href="#" target="_blank" class="wa-btn">
                <i class="fa-brands fa-whatsapp" style="font-size: 20px;"></i> Kirim Pesanan via WhatsApp
            </a>
            <button class="close-modal" onclick="closeCartModalDirect()">Kembali Pilih Menu</button>
        </div>
    </div>

    <!-- Menghubungkan ke berkas JavaScript -->
    <script src="script.js"></script>
</body>
</html>
